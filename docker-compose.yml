#version: "3.9" # version of docker

services:
  spark-iceberg:

    build:
      context: . # build the image from the current directory
      dockerfile: Dockerfile # use the Dockerfile in the current directory
      
    container_name: spark-iceberg # name given to the container

    ports:
      - "8888:8888" # Jupyter notebook
      - "4040:4040" # Spark web UI

    env_file:
      - ./config/project.env

    volumes:

      # Newly added volumes for ingestion, spark, iceberg, data_quality, tests, and config directories
      - ./ingestion:/home/iceberg/ingestion
      - ./spark:/home/iceberg/spark
      - ./iceberg:/home/iceberg/iceberg
      - ./data_quality:/home/iceberg/data_quality
      - ./tests:/home/iceberg/tests
      - ./config:/home/iceberg/config
      # Existing directories 
      - ./warehouse:/home/iceberg/warehouse #connecting the local warehouse directory to the container's warehouse directory
      - ./data:/home/iceberg/data #connecting the local data directory to the container's data directory
      - ./notebooks:/home/iceberg/notebooks #connecting the local notebooks directory to the container's notebooks directory
      - ./scripts:/home/iceberg/scripts #connecting the local scripts directory to the container's scripts directory
      # AWS credentials directory
      - ~/.aws:/root/.aws:ro # connecting the local AWS credentials directory to the container's AWS credentials directory


    stdin_open: true # allows us to enter the container and run commands interactively
    tty: true # keeps the terminal open for interactive sessions

  airflow:
    image: apache/airflow:2.10.5

    container_name: airflow

    depends_on:
      - spark-iceberg

    ports:
      - "8080:8080"

    group_add:
      - "983"

    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
        --username admin
        --password admin
        --firstname Ram
        --lastname Thapa
        --role Admin
        --email admin@example.com || true &&
      exec airflow webserver
      "
  airflow-scheduler:
    image: apache/airflow:2.10.5

    container_name: airflow-scheduler

    depends_on:
      - airflow

    group_add:
      - "983"

    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock

    command: airflow scheduler      